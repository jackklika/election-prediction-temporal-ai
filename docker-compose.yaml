services:
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: predictelection
    # Temporal's schema setup races an unready Postgres without this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Reuses the Postgres above, creating its own `temporal` and
  # `temporal_visibility` databases, so Temporal's internal state stays separate
  # from the research data without a second server to run.
  temporal:
    image: temporalio/auto-setup:1.27.0
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 7233:7233
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: password
    healthcheck:
      # --address is required: the frontend binds to the container's own IP, so
      # the CLI's 127.0.0.1 default is refused.
      test:
        ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:latest
    platform: linux/amd64
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080

  # Stands in for S3 locally. Same API, so the integration tests exercise the
  # same S3ObjectStore that talks to AWS in production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
