name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # todo: set a default value in code or something
  ANTHROPIC_API_KEY: ci-does-not-call-anthropic

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # Only the services the tests actually reach: Postgres and MinIO. The
      # workflow tests run against temporalio.testing's in-process server, so
      # compose's temporal/temporal-ui images would be pull time for nothing —
      # which is why this isn't `make test-db` (whose db-up waits on all four).
      - run: docker compose up -d --wait postgres minio
      - run: uv run pytest --require-postgres
